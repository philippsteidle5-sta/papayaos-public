<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PapayaOS – Anmelden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050000; --ink:#fff6ee; --mute:#b9a99c; --dim:#7d6d62;
  --line:rgba(255,255,255,.12); --card:rgba(255,255,255,.04);
  --orange:#ff7a00; --orange-hi:#ff9a2e; --amber:#ffc04d;
  --serif:"Cormorant Garamond","Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow-x:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(60% 70% at 78% 45%,rgba(180,30,0,.38),transparent 70%),radial-gradient(40% 40% at 15% 100%,rgba(120,40,0,.25),transparent 70%);pointer-events:none}
#orb{position:fixed;right:-4vw;top:50%;width:min(62vw,820px);aspect-ratio:1;transform:translateY(-50%);z-index:0;pointer-events:none}
nav{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:24px clamp(20px,3.4vw,64px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:500;font-size:15px}
.brand i{width:16px;height:22px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:linear-gradient(160deg,var(--amber),var(--orange));box-shadow:0 0 14px rgba(255,122,0,.6)}
.pill{display:flex;gap:2px;padding:5px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.45);backdrop-filter:blur(10px)}
.pill a{padding:9px 18px;border-radius:999px;font-size:13px;color:var(--mute);text-decoration:none}
.pill a.on{background:rgba(255,255,255,.1);color:var(--ink)}
.close{width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,192,77,.45);background:rgba(255,192,77,.12);color:var(--amber);cursor:pointer;font-size:18px;box-shadow:0 0 24px rgba(255,160,0,.18)}
main{position:relative;z-index:1;min-height:calc(100vh - 96px);display:flex;align-items:center;padding:20px clamp(20px,3.4vw,64px) 90px}
.wrap{width:min(100%,480px)}
.eyebrow{display:flex;align-items:center;gap:14px;font-size:11px;letter-spacing:.04em;color:var(--orange-hi);margin-bottom:22px}
.eyebrow::before{content:"";width:30px;height:1px;background:var(--orange-hi)}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(46px,6.2vw,84px);line-height:.98;letter-spacing:-.01em;margin:0 0 22px}
.lead{margin:0 0 30px;color:var(--mute);font-size:15px;line-height:1.7;max-width:42ch}
.tabs{display:inline-flex;padding:4px;border:1px solid var(--line);border-radius:999px;margin-bottom:18px}
.tabs button{border:0;background:none;color:var(--mute);font:500 13px var(--sans);padding:9px 22px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.tabs button.on{background:#fff;color:#1a0a00}
form{display:grid;gap:12px}
.field{display:flex;align-items:center;gap:12px;height:56px;padding:0 22px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);transition:border-color .2s,box-shadow .2s}
.field:focus-within{border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,122,0,.16)}
.field svg{flex:none;width:18px;height:18px;stroke:var(--dim);fill:none;stroke-width:1.6}
.field input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);font:400 15px var(--sans)}
.field input::placeholder{color:var(--dim)}
.field.extra{display:none}
.reg .field.extra{display:flex}
.keymode .tabs,.keymode .account-field,.keymode .account-row{display:none}
.field.key-field{display:none}
.keymode .field.key-field{display:flex}
.row{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--mute);padding:2px 8px}
.row label{display:flex;align-items:center;gap:9px;cursor:pointer}
.row input{accent-color:var(--orange);width:16px;height:16px}
.row a{color:var(--mute)}
.cta{height:56px;border:0;border-radius:999px;background:var(--orange);color:#1a0a00;font:600 15px var(--sans);cursor:pointer;box-shadow:0 10px 40px rgba(255,122,0,.35);transition:transform .15s,background .2s}
.cta:hover{background:var(--orange-hi)}
.cta:active{transform:scale(.985)}
.msg{min-height:18px;font-size:13px;color:#ff9a7a;padding-left:8px}
.fine{margin-top:6px;font-size:12px;color:var(--dim)}
.beta{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;align-items:center;gap:10px;height:44px;padding:0 20px;border-radius:999px;border:1px solid rgba(255,192,77,.5);background:rgba(10,4,0,.8);color:var(--ink);font:600 13px var(--sans);cursor:pointer;backdrop-filter:blur(8px)}
.beta svg{width:16px;height:16px;stroke:var(--amber);fill:none;stroke-width:1.8}
button:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
@media(max-width:820px){.pill{display:none}#orb{width:120vw;right:-40vw;opacity:.55}}
body.embedded nav{padding-block:12px}
body.embedded main{min-height:0;padding-top:4px;padding-bottom:56px}
body.embedded h1{font-size:clamp(42px,5.6vw,68px);margin-bottom:16px}
body.embedded .lead{margin-bottom:20px}
body.embedded .field{height:52px}
</style>
</head>
<body>
<canvas id="orb"></canvas>
<nav>
  <div class="brand"><i></i>PapayaOS</div>
  <button class="close" aria-label="Schließen" type="button">✕</button>
</nav>
<main>
  <div class="wrap">
    <div class="eyebrow">Sovereign Access Terminal</div>
    <h1 id="h">Willkommen zurück</h1>
    <p class="lead" id="lead">Melde dich an und dein Multi-Agent-System läuft genau dort weiter, wo du aufgehört hast.</p>
    <div class="tabs" role="tablist">
      <button type="button" class="on" data-m="login" role="tab">Login</button>
      <button type="button" data-m="register" role="tab">Registrieren</button>
    </div>
    <form id="f" novalidate>
      <label class="field account-field"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg><input id="email" type="email" autocomplete="email" placeholder="name@beispiel.de" aria-label="E-Mail-Adresse"></label>
      <label class="field account-field"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input id="pw" type="password" autocomplete="current-password" placeholder="Passwort" aria-label="Passwort"></label>
      <label class="field extra account-field"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input id="pw2" type="password" autocomplete="new-password" placeholder="Passwort wiederholen" aria-label="Passwort wiederholen"></label>
      <label class="field key-field"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9m-3 3 3 3"/></svg><input id="betaKey" type="text" autocomplete="off" placeholder="Beta-Key eingeben" aria-label="Beta-Key"></label>
      <div class="row account-row"><label><input type="checkbox" checked> Angemeldet bleiben</label><span>256-Bit verschlüsselt</span></div>
      <div class="msg" id="msg" role="alert"></div>
      <button class="cta" id="go" type="submit">Anmelden</button>
    </form>
  </div>
</main>
<button class="beta" type="button"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9m-3 3 3 3"/></svg>Beta-Key nutzen</button>
<script>
(function(){
  if(window.parent!==window)document.body.classList.add("embedded");
  var mode="login",f=document.getElementById("f"),msg=document.getElementById("msg"),go=document.getElementById("go");
  var emailInput=document.getElementById("email"),passwordInput=document.getElementById("pw"),confirmInput=document.getElementById("pw2"),betaInput=document.getElementById("betaKey");
  var T={login:["Willkommen zurück","Melde dich an und dein Multi-Agent-System läuft genau dort weiter, wo du aufgehört hast.","Anmelden"],
         register:["Zugang erstellen","Ein Konto, alle Agenten. Registriere dich und starte deinen Core.","Konto erstellen"],
         beta:["Beta-Zugang nutzen","Gib deinen persönlichen Beta-Key ein, um deinen Workspace zu öffnen.","Beta-Key prüfen"]};
  function setMode(next){
    mode=next;f.classList.toggle("reg",mode==="register");document.body.classList.toggle("keymode",mode==="beta");
    document.querySelectorAll(".tabs button").forEach(function(button){button.classList.toggle("on",button.dataset.m===mode)});
    document.getElementById("h").textContent=T[mode][0];document.getElementById("lead").textContent=T[mode][1];go.textContent=T[mode][2];msg.textContent="";
    if(mode==="beta")betaInput.focus();else emailInput.focus();
  }
  document.querySelectorAll(".tabs button").forEach(function(button){button.onclick=function(){setMode(button.dataset.m)}});
  document.querySelector(".beta").addEventListener("click",function(){setMode(mode==="beta"?"login":"beta")});
  document.querySelector(".close").addEventListener("click",function(){
    if(window.parent!==window)window.parent.postMessage({type:"papayaos:close-login"},location.origin);
    else location.assign("/sales-preview.html");
  });
  async function finishSignIn(){
    if(window.parent!==window)window.parent.postMessage({type:"papayaos:auth-success"},location.origin);
    else location.assign("/?app=true");
  }
  f.onsubmit=async function(event){
    event.preventDefault();msg.textContent="";go.disabled=true;go.setAttribute("aria-busy","true");
    try{
      if(mode==="beta"){
        var key=betaInput.value.trim();if(!key)throw new Error("Bitte gib deinen Beta-Key ein.");
        var keyResponse=await fetch("/api/access-keys/validate",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({key:key})});
        var keyData=await keyResponse.json();if(!keyResponse.ok||keyData.valid!==true||!keyData.keyRecord)throw new Error(keyData.message||"Dieser Beta-Key ist ungültig.");
        var record=keyData.keyRecord,normalized=record.key.replace(/[\s-]/g,"").toLowerCase(),stored=[];
        try{stored=JSON.parse(localStorage.getItem("syntax_quantum_access_keys_v2")||"[]");if(!Array.isArray(stored))stored=[]}catch{stored=[]}
        var localRecord=Object.assign({},record,{usedCount:Math.max(0,Number(record.usedCount||0)-1)}),at=stored.findIndex(function(item){return item.key.replace(/[\s-]/g,"").toLowerCase()===normalized});
        if(at>=0)stored[at]=localRecord;else stored.unshift(localRecord);localStorage.setItem("syntax_quantum_access_keys_v2",JSON.stringify(stored));
        var sessionEmail="key_"+normalized+"@syntax.local",role=keyData.isBetaTester?"CLOSED_BETA_TESTER":"SOVEREIGN",token="KEY-"+normalized.toUpperCase()+"-"+Math.random().toString(36).slice(2,6).toUpperCase();
        localStorage.setItem("syntax_active_redeemed_key",JSON.stringify(record));localStorage.setItem("syntax_current_user_email",sessionEmail);localStorage.setItem("syntax_admin_authenticated_session","false");
        localStorage.setItem("maze_registered_vip_user",JSON.stringify({name:record.label||"PapayaOS Beta",email:sessionEmail,slot:1,token:token,plan:"ENTERPRISE_99",trialExpiresAt:record.expiresAt,accessKey:record.key,role:role}));
        msg.style.color="#9be6b1";msg.textContent="Beta-Key bestätigt. Workspace wird geöffnet.";await finishSignIn();return;
      }
      var em=emailInput.value.trim(),password=passwordInput.value;
      if(!/^\S+@\S+\.\S+$/.test(em))throw new Error("Gib eine gültige E-Mail-Adresse ein.");
      if(!password)throw new Error("Bitte gib dein Passwort ein.");
      if(mode==="register"&&password.length<8)throw new Error("Das Passwort braucht mindestens 8 Zeichen.");
      if(mode==="register"&&password!==confirmInput.value)throw new Error("Die Passwörter stimmen nicht überein.");
      var payload={email:em,password:password};
      var endpoint="/api/auth/login";
      if(mode==="register"){
        endpoint="/api/auth/register";payload={name:em.split("@")[0],email:em,password:password,confirmPassword:confirmInput.value,plan:"PRO_29",goal:"PapayaOS Beta Zugang"};
      }
      var response=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify(payload)}),data=await response.json();
      if(!response.ok||data.ok!==true||!data.user)throw new Error(data.message||"Anmeldung fehlgeschlagen.");
      var sessionResponse=await fetch("/api/auth/me",{credentials:"same-origin",cache:"no-store"});
      var sessionData=sessionResponse.ok?await sessionResponse.json():null;
      if(!sessionData?.ok||!sessionData.user?.email)throw new Error("Die Anmeldung konnte nicht gespeichert werden. Bitte versuche es erneut.");
      var user=sessionData.user,accountEmail=user.email.trim().toLowerCase();
      try{
        localStorage.setItem("syntax_current_user_email",accountEmail);
        localStorage.setItem("maze_current_user_email",accountEmail);
        localStorage.setItem("syntax_admin_authenticated_session",String(user.isFullCoreAdmin===true));
        localStorage.setItem("maze_registered_vip_user",JSON.stringify({name:user.name,email:accountEmail,slot:user.slot,plan:user.plan,role:user.role}));
        localStorage.setItem("syntax_entered_matrix_session","true");
        sessionStorage.setItem("syntax_entered_matrix_session","true");
        sessionStorage.setItem("syntax_user_preferred_view","app");
      }catch{}
      msg.style.color="#9be6b1";msg.textContent=mode==="register"?"Konto erstellt. Workspace wird geöffnet.":"Angemeldet. Workspace wird geöffnet.";await finishSignIn();
    }catch(error){msg.style.color="#ff9a7a";msg.textContent=error instanceof Error?error.message:"Verbindung fehlgeschlagen. Bitte versuche es erneut."}
    finally{go.disabled=false;go.removeAttribute("aria-busy")}
  };

  // Partikel-Kugel
  var c=document.getElementById("orb"),x=c.getContext("2d"),N=1400,pts=[],S=0,t=0;
  for(var i=0;i<N;i++){var y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),a=i*2.399963;pts.push([Math.cos(a)*r,y,Math.sin(a)*r,Math.random()])}
  function size(){var d=Math.min(devicePixelRatio||1,2);S=c.clientWidth*d;c.width=c.height=S}
  size();addEventListener("resize",size);
  var still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function draw(){
    x.clearRect(0,0,S,S);
    var R=S*.34,cx=S/2,cy=S/2;
    var g=x.createRadialGradient(cx,cy,R*.55,cx,cy,R*1.35);
    g.addColorStop(0,"rgba(255,90,0,.22)");g.addColorStop(.7,"rgba(255,60,0,.12)");g.addColorStop(1,"rgba(255,60,0,0)");
    x.fillStyle=g;x.fillRect(0,0,S,S);
    x.beginPath();x.arc(cx,cy,R,0,6.2832);x.strokeStyle="rgba(255,170,60,.75)";x.lineWidth=S*.004;x.shadowColor="#ff7a00";x.shadowBlur=S*.03;x.stroke();x.shadowBlur=0;
    var cs=Math.cos(t),sn=Math.sin(t);
    for(var i=0;i<N;i++){
      var p=pts[i],px=p[0]*cs+p[2]*sn,pz=-p[0]*sn+p[2]*cs,py=p[1];
      var k=(pz+1)/2,sz=(.6+p[3]*1.6)*(S/900)*(.5+k);
      x.globalAlpha=.25+k*.75;
      x.fillStyle=p[3]>.8?"#fff1c9":(p[3]>.4?"#ffa733":"#ff5a14");
      x.beginPath();x.arc(cx+px*R,cy+py*R,sz,0,6.2832);x.fill();
    }
    x.globalAlpha=1;
    if(!still){t+=.0022;requestAnimationFrame(draw)}
  }
  draw();
})();
</script>
</body>
</html>
