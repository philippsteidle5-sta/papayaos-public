<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PapayaOS – Closed Beta</title>
<meta name="description" content="Drei KI-Agenten, ein Betriebssystem für dein Leben. Trag dich für die PapayaOS Closed Beta ein.">
<meta name="theme-color" content="#071F16">
<meta property="og:title" content="PapayaOS – Closed Beta">
<meta property="og:description" content="Drei Agenten. Ein Betriebssystem für dein Leben.">
<meta property="og:type" content="website">
<style>
@property --ac{syntax:'<color>';inherits:true;initial-value:#ff9f43}
:root{color-scheme:dark;--bg:#071F16;--s2:#102B20;--s3:#19372A;--tx:#F5F0E6;--mu:#A7B9AD;--line:rgba(245,240,230,.11);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;--ac:#ff9f43;transition:--ac .45s;background:var(--bg);color:var(--tx);font-family:ui-rounded,"SF Pro Rounded",Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6;overflow-x:hidden;
 background-image:radial-gradient(55% 40% at 50% 12%,color-mix(in srgb,var(--ac) 17%,transparent),transparent 72%),radial-gradient(45% 35% at 100% 100%,color-mix(in srgb,var(--ac) 9%,transparent),transparent 70%);background-repeat:no-repeat;background-attachment:fixed}
body[data-agent=mango]{--ac:#ffc93c}body[data-agent=kiwi]{--ac:#a6d84a}
button,input{font:inherit;color:inherit}
.serif{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.wrap{width:min(1080px,100% - 36px);margin:0 auto}
img{display:block;max-width:100%}
/* Kopf */
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem}
.logo img{width:34px;height:34px;border-radius:50%;background:var(--s3);padding:3px;object-fit:cover;object-position:top}
.seg{display:flex;padding:3px;border-radius:12px;background:var(--s2);border:1px solid var(--line)}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:9px;font-size:.84rem;color:var(--mu);transition:background .2s,color .2s}
.seg button:focus-visible{outline:2px solid var(--ac)}
.seg button[aria-pressed=true]{background:var(--s3);color:var(--tx);box-shadow:inset 0 0 0 1px var(--ac)}
/* Hero */
.hero{text-align:center;padding:14px 0 70px}
.mw{position:relative;display:inline-block}
.mw::before{content:"";position:absolute;left:50%;top:54%;width:340px;height:340px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--ac) 30%,transparent),transparent 68%)}
.mw img{position:relative;filter:drop-shadow(0 18px 18px rgba(0,0,0,.4));transform-origin:50% 90%;animation:idle 4.2s ease-in-out infinite}
.hero .mw img{height:270px;width:auto;animation:enter .8s cubic-bezier(.3,1.4,.5,1) both,idle 4.2s ease-in-out .8s infinite}
.badge{display:inline-block;margin:10px 0 0;font-size:.76rem;font-weight:700;padding:4px 14px;border-radius:99px;background:color-mix(in srgb,var(--ac) 14%,transparent);border:1px solid color-mix(in srgb,var(--ac) 45%,transparent);color:var(--ac)}
h1{font-size:clamp(2.5rem,7vw,4.4rem);font-weight:500;line-height:1.02;letter-spacing:-.02em;margin:14px auto 12px;max-width:15em}
.lead{color:var(--mu);font-size:1.12rem;max-width:34em;margin:0 auto 28px}
/* Formular */
.form{width:min(560px,100%);margin:0 auto;text-align:left}
.comp{display:flex;gap:10px;align-items:center;padding:7px 7px 7px 20px;border-radius:99px;background:var(--s2);border:1px solid var(--line);box-shadow:0 10px 28px rgba(0,0,0,.3);transition:border-color .2s}
.comp:focus-within{border-color:var(--ac)}
.comp input{flex:1;min-width:0;border:0;outline:0;background:none;padding:10px 0;font-size:1rem}
.comp input::placeholder{color:var(--mu)}
.go{all:unset;cursor:pointer;flex:none;padding:12px 22px;border-radius:99px;font-weight:700;color:#1a1200;background:var(--ac);transition:transform .15s,opacity .2s,background .45s}
.go:hover{transform:scale(1.04)}.go:active{transform:scale(.96)}.go:focus-visible{outline:2px solid var(--tx)}
.go:disabled{opacity:.5;cursor:default;transform:none}
.pick{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px 0 4px;color:var(--mu);font-size:.9rem}
.pick button{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;padding:4px 12px 4px 4px;border-radius:99px;background:var(--s2);border:1px solid var(--line);font-size:.86rem;transition:border-color .2s,background .2s}
.pick button:focus-visible{outline:2px solid var(--ac)}
.pick img{width:30px;height:30px;border-radius:50%;background:var(--s3);object-fit:cover;object-position:top}
.pick button[aria-pressed=true]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--s2))}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:.82rem;color:var(--mu)}
.chk input{margin:3px 0 0;accent-color:var(--ac);width:16px;height:16px;flex:none}
.chk a{color:var(--ac);text-underline-offset:3px}
.msg{min-height:1.4em;margin:10px 0 0;font-size:.86rem;text-align:center;color:#ffb3a5}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.ok{text-align:center;padding:8px 0}
.ok .mw img{height:170px;width:auto;animation:hop .8s cubic-bezier(.3,1.5,.5,1)}
.ok h3{font-size:2.2rem;font-weight:500;margin:6px 0 2px}
.ok p{margin:0;color:var(--mu)}
.demo{margin:8px 0 0;text-align:center;font-size:.74rem;color:var(--mu)}
/* Abschnitte */
section{padding:56px 0}
h2{font-size:clamp(2rem,5vw,3rem);font-weight:500;letter-spacing:-.02em;line-height:1.1;margin:0 0 10px}
.sub{color:var(--mu);margin:0 0 30px;max-width:36em}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:22px 20px 24px;border-radius:24px;background:var(--s2);border:1px solid var(--line);transition:transform .25s cubic-bezier(.3,1.5,.5,1),border-color .25s,background .25s}
.card:hover,.card[aria-pressed=true]{transform:translateY(-4px);border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,var(--s2))}
.card:focus-visible{outline:2px solid var(--c);outline-offset:3px}
.card img{height:170px;width:auto;margin-bottom:6px;filter:drop-shadow(0 12px 12px rgba(0,0,0,.4));transform-origin:50% 90%}
.card b{font-size:1.7rem;font-weight:500}
.card .role{color:var(--c);font-weight:700;font-size:.9rem}
.card p{margin:4px 0 8px;color:var(--mu);font-size:.95rem}
.pills{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pills span{font-size:.78rem;padding:4px 12px;border-radius:99px;background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c);font-weight:600}
/* Chat */
.chat{width:min(640px,100%);margin:0 auto;display:flex;flex-direction:column;gap:16px;padding:26px;border-radius:28px;background:color-mix(in srgb,var(--s2) 70%,transparent);border:1px solid var(--line)}
.m{display:flex;gap:12px}.m.u{justify-content:flex-end}
.av{width:38px;height:38px;border-radius:50%;flex:none;background:var(--s3);object-fit:cover;object-position:top}
.bub{padding:12px 18px;line-height:1.6;font-size:1rem}
.u .bub{max-width:82%;background:var(--tx);color:#14241b;border-radius:22px 22px 6px 22px;font-weight:500}
.b .bub{background:color-mix(in srgb,var(--ac) 12%,var(--s2));border:1px solid color-mix(in srgb,var(--ac) 28%,transparent);border-radius:22px 22px 22px 6px}
/* Warum */
.why{display:grid;grid-template-columns:repeat(2,1fr);gap:26px 48px;list-style:none;margin:0;padding:0}
.why li{padding-left:18px;border-left:2px solid var(--ac);transition:border-color .45s}
.why b{display:block;font-size:1.15rem;margin-bottom:2px}
.why span{color:var(--mu)}
/* Abschluss */
.final{text-align:center}
.trio{display:flex;justify-content:center;align-items:flex-end;margin:0 0 6px}
.trio img{height:190px;width:auto;filter:drop-shadow(0 14px 14px rgba(0,0,0,.4));transform-origin:50% 90%}
.trio img:nth-child(1){transform:rotate(9deg) translateY(16px);margin-right:-18px}
.trio img:nth-child(2){height:230px;position:relative;z-index:1}
.trio img:nth-child(3){transform:rotate(-9deg) translateY(16px);margin-left:-18px}
footer{border-top:1px solid var(--line);padding:26px 0 34px;color:var(--mu);font-size:.84rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center;justify-content:space-between}
footer nav{display:flex;gap:20px}footer a{color:var(--mu);text-underline-offset:3px}footer a:hover{color:var(--tx)}
@keyframes idle{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}
@keyframes enter{0%{opacity:0;transform:scale(.55) rotate(-8deg) translateY(30px)}70%{transform:scale(1.06) rotate(2deg)}100%{opacity:1;transform:none}}
@keyframes hop{0%{transform:none}35%{transform:translateY(-30px) rotate(-5deg)}70%{transform:scale(1.06,.94)}100%{transform:none}}
.hop{animation:hop .75s cubic-bezier(.3,1.5,.5,1)!important}
@media(max-width:820px){.cards{grid-template-columns:1fr}.why{grid-template-columns:1fr}.trio img{height:140px}.trio img:nth-child(2){height:170px}}
@media(max-width:480px){.comp{flex-direction:column;border-radius:28px;padding:8px 8px 8px 8px;align-items:stretch}.comp input{padding:10px 14px}.go{text-align:center}.hero .mw img{height:220px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

  <div class="form" data-form></div>
 </section>
 </main>
</div>

var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function hop(el){el.classList.remove('hop');void el.offsetWidth;el.classList.add('hop');el.addEventListener('animationend',function f(){el.classList.remove('hop');el.removeEventListener('animationend',f)})}
function setAgent(k){document.body.dataset.agent=k}
$$('[data-m]').forEach(function(i){i.src=IMG[i.dataset.m]});

var FORM='<form novalidate><div class="comp"><input type="email" name="email" autocomplete="email" inputmode="email" data-ph="ph" aria-label="E-Mail"><button class="go" type="submit" data-i="cta"></button></div>'+
 
 '<label class="chk"><input type="checkbox" name="consent"><span data-h="consent"></span></label>'+
 '<div class="hp" aria-hidden="true"><input type="text" name="website" tabindex="-1" autocomplete="off"></div>'+
 '<p class="msg" role="alert"></p></form>';
$$('[data-form]').forEach(function(box){
  box.innerHTML=FORM;
  var form=box.firstChild, choice='';
  
  form.addEventListener('submit',function(e){
    e.preventDefault();var d=T[lang],msg=form.querySelector('.msg'),em=form.email.value.trim(),btn=form.querySelector('.go');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){msg.textContent=d.eMail;form.email.focus();return}
    if(!form.consent.checked){msg.textContent=d.eConsent;form.consent.focus();return}
    msg.textContent='';btn.disabled=true;btn.textContent=d.busy;
    var done=function(){box.innerHTML='<div class="ok" role="status"><div class="mw"><img alt="" src="'+IMG.yes+'"></div><h3 class="serif">'+d.okH+'</h3><p>'+d.okP+'</p>'+(SIGNUP_ENDPOINT?'':'<p class="demo">'+d.demo+'</p>')+'</div>'};
    if(form.website.value){done();return}
    if(!SIGNUP_ENDPOINT){setTimeout(done,700);return}
    fetch(SIGNUP_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em,agent:document.body.dataset.agent||choice,lang:lang,consent:true})})
      .then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(result){if(result.ok!==true)throw 0;done()}).catch(function(){msg.textContent=d.eNet;btn.disabled=false;btn.textContent=d.cta});
  });
});
